        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.documentElement.lang = currentLang === 'ar' ? 'ar' : 'en';
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            
            const data = contentData[currentLang];
            document.getElementById('langBtnText').innerText = currentLang === 'ar' ? 'English' : 'العربية';
            document.getElementById('homeBtnText').innerText = data.homeBtnText;
            document.getElementById('mainTitle').innerText = data.mainTitle;
            document.getElementById('mainSubtitle').innerText = data.mainSubtitle;
            document.getElementById('sidebarHeader').innerText = data.sidebarHeader;
            document.getElementById('footerText').innerText = data.footerText;
            document.getElementById('searchInput').placeholder = data.searchPlaceholder;

            renderNav();
            renderContent();
        }

        function goHome() {
            currentStandardId = 'home';
            renderNav();
            renderContent();
        }

        function selectStandard(id) {
            currentStandardId = id;
            renderNav();
            renderContent();
        }

        function toggleComplete(id) {
            if (completedStandards.has(id)) {
                completedStandards.delete(id);
            } else {
                completedStandards.add(id);
            }
            renderNav();
            renderContent();
        }

        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
            renderNav();
        }

        function renderNav() {
            const container = document.getElementById('standardsNav');
            const standards = contentData[currentLang].standards;
            
            let html = '';
            for (const [id, std] of Object.entries(standards)) {
                if (searchQuery) {
                    const matchCode = std.code.toLowerCase().includes(searchQuery);
                    const matchName = std.name.toLowerCase().includes(searchQuery);
                    if (!matchCode && !matchName) continue;
                }

                const isActive = id === currentStandardId;
                const isCompleted = completedStandards.has(id);
                const activeClass = isActive 
                    ? 'bg-gradient-to-r from-[#38A2D7] to-[#561139] text-white shadow-lg font-semibold' 
                    : 'bg-white/70 hover:bg-white text-slate-700 font-medium';
                
                html += `
                    <button onclick="selectStandard('${id}')" class="w-full text-right p-3 rounded-xl transition-all flex items-center justify-between border border-white/40 ${activeClass}">
                        <span class="flex items-center gap-2 text-xs sm:text-sm truncate">
                            <span class="font-bold text-xs px-2 py-0.5 rounded ${isActive ? 'bg-white/20 text-white' : 'bg-slate-200 text-slate-700'}">${std.code}</span>
                            <span class="truncate">${std.name}</span>
                        </span>
                        ${isCompleted ? '<span class="text-xs">✅</span>' : ''}
                    </button>
                `;
            }

            if (html === '') {
                html = `<p class="text-xs text-center text-slate-500 py-4">${currentLang === 'ar' ? 'لا توجد نتائج مطابقة' : 'No matching results'}</p>`;
            }

            container.innerHTML = html;
        }

                        </div>
                        <div>
                            <label class="block mb-1 font-semibold">${currentLang === 'ar' ? 'سنوات الإطفاء' : 'Amortization Years'}</label>
                            <input type="number" id="ias38_years" value="4" oninput="calcIAS38()" class="w-full px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none">
                        </div>
                    </div>
                    <div id="ias38_res" class="bg-slate-800/80 p-3 rounded-xl border border-slate-700 text-xs text-emerald-300 font-mono space-y-1"></div>
                `;
                calcIAS38();
            } else if (calcType === 'ifrs15') {
                container.innerHTML = `
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs text-slate-200 mb-3">
                        <div>
                            <label class="block mb-1 font-semibold">${currentLang === 'ar' ? 'سعر العقد الشامل ($)' : 'Total Bundle Price ($)'}</label>
                            <input type="number" id="ifrs15_bundle" value="900" oninput="calcIFRS15()" class="w-full px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none">
                        </div>
                        <div>
                            <label class="block mb-1 font-semibold">${currentLang === 'ar' ? 'سعر المنتج المنفصل ($)' : 'Standalone Item Price ($)'}</label>
                            <input type="number" id="ifrs15_item" value="800" oninput="calcIFRS15()" class="w-full px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none">
                        </div>
                        <div>
                            <label class="block mb-1 font-semibold">${currentLang === 'ar' ? 'سعر الخدمة المنفصلة ($)' : 'Standalone Service Price ($)'}</label>
                            <input type="number" id="ifrs15_service" value="200" oninput="calcIFRS15()" class="w-full px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none">
                        </div>
                    </div>
                    <div id="ifrs15_res" class="bg-slate-800/80 p-3 rounded-xl border border-slate-700 text-xs text-emerald-300 font-mono space-y-1"></div>
                `;
                calcIFRS15();
            } else if (calcType === 'ifrs16') {
                container.innerHTML = `
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs text-slate-200 mb-3">
                        <div>
                            <label class="block mb-1 font-semibold">${currentLang === 'ar' ? 'القسط السنوي ($)' : 'Annual Payment ($)'}</label>
                            <input type="number" id="ifrs16_pay" value="30000" oninput="calcIFRS16()" class="w-full px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none">
                        </div>
                        <div>
                            <label class="block mb-1 font-semibold">${currentLang === 'ar' ? 'مدة العقد (سنوات)' : 'Lease Years'}</label>
                            <input type="number" id="ifrs16_years" value="3" oninput="calcIFRS16()" class="w-full px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none">
                        </div>
                        <div>
                            <label class="block mb-1 font-semibold">${currentLang === 'ar' ? 'معدل الفائدة (%)' : 'Interest Rate (%)'}</label>
                            <input type="number" id="ifrs16_rate" value="8" oninput="calcIFRS16()" class="w-full px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none">
                        </div>
                    </div>
                    <div id="ifrs16_res" class="bg-slate-800/80 p-3 rounded-xl border border-slate-700 text-xs text-emerald-300 font-mono space-y-1"></div>
                `;
                calcIFRS16();
            } else if (calcType === 'ifrs9') {
                container.innerHTML = `
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs text-slate-200 mb-3">
                        <div>
                            <label class="block mb-1 font-semibold">${currentLang === 'ar' ? 'قيمة الدين / الذمم ($)' : 'Exposure Debt Amount ($)'}</label>
                            <input type="number" id="ifrs9_amount" value="200000" oninput="calcIFRS9()" class="w-full px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none">
                        </div>
                        <div>
                            <label class="block mb-1 font-semibold">${currentLang === 'ar' ? 'احتمال التعثر (PD %)' : 'Probability of Default (PD %)'}</label>
                            <input type="number" id="ifrs9_pd" value="5" oninput="calcIFRS9()" class="w-full px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none">
                        </div>
                        <div>
                            <label class="block mb-1 font-semibold">${currentLang === 'ar' ? 'خسارة التعثر (LGD %)' : 'Loss Given Default (LGD %)'}</label>
                            <input type="number" id="ifrs9_lgd" value="80" oninput="calcIFRS9()" class="w-full px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none">
                        </div>
                    </div>
                    <div id="ifrs9_res" class="bg-slate-800/80 p-3 rounded-xl border border-slate-700 text-xs text-emerald-300 font-mono space-y-1"></div>
                `;
                calcIFRS9();
            }
        }

        function calcIAS16() {
            const price = parseFloat(document.getElementById('ias16_price').value) || 0;
            const setup = parseFloat(document.getElementById('ias16_setup').value) || 0;
            const years = parseFloat(document.getElementById('ias16_years').value) || 1;

            const totalCost = price + setup;
            const annualDep = totalCost / (years > 0 ? years : 1);

            document.getElementById('ias16_res').innerHTML = `
                <div><strong>${currentLang === 'ar' ? 'التكلفة الرأسمالية الموحدة للأصل:' : 'Capitalized Asset Cost:'}</strong> $${totalCost.toLocaleString()}</div>
                <div><strong>${currentLang === 'ar' ? 'قسط الإهلاك السنوي:' : 'Annual Depreciation:'}</strong> $${annualDep.toFixed(2).toLocaleString()} / year</div>
            `;
        }

        function calcIAS2() {
            const cost = parseFloat(document.getElementById('ias2_cost').value) || 0;
            const price = parseFloat(document.getElementById('ias2_price').value) || 0;
            const sellCost = parseFloat(document.getElementById('ias2_sellCost').value) || 0;

            const nrv = price - sellCost;
            const loss = Math.max(0, cost - nrv);
            const bookVal = Math.min(cost, nrv);

            document.getElementById('ias2_res').innerHTML = `
                <div><strong>${currentLang === 'ar' ? 'صافي القيمة القابلة للتحقق (NRV):' : 'Net Realizable Value (NRV):'}</strong> $${nrv.toLocaleString()}</div>
                <div><strong>${currentLang === 'ar' ? 'القيمة المسجلة بالمركز المالي (الأقل):' : 'Carrying Amount on Balance Sheet:'}</strong> $${bookVal.toLocaleString()}</div>
                <div class="${loss > 0 ? 'text-amber-400 font-bold' : ''}"><strong>${currentLang === 'ar' ? 'خسائر هبوط المخزون المطلوبة:' : 'Impairment Loss Required:'}</strong> $${loss.toLocaleString()}</div>
            `;
        }

        function calcIAS38() {
            const resCost = parseFloat(document.getElementById('ias38_resCost').value) || 0;
            const devCost = parseFloat(document.getElementById('ias38_devCost').value) || 0;
            const years = parseFloat(document.getElementById('ias38_years').value) || 1;

            const annAmort = devCost / (years > 0 ? years : 1);

            document.getElementById('ias38_res').innerHTML = `
                <div><strong>${currentLang === 'ar' ? 'مصروفات البحث (قائمة الدخل فوراً):' : 'Expensed Research Cost:'}</strong> $${resCost.toLocaleString()}</div>
                <div><strong>${currentLang === 'ar' ? 'الأصل غير الملموس المرأسمال:' : 'Capitalized Intangible Asset:'}</strong> $${devCost.toLocaleString()}</div>
                <div><strong>${currentLang === 'ar' ? 'قسط الإطفاء السنوي:' : 'Annual Amortization:'}</strong> $${annAmort.toFixed(2).toLocaleString()} / year</div>
            `;
        }

        function calcIFRS15() {
            const bundle = parseFloat(document.getElementById('ifrs15_bundle').value) || 0;
            const item = parseFloat(document.getElementById('ifrs15_item').value) || 0;
            const service = parseFloat(document.getElementById('ifrs15_service').value) || 0;

            const totalStandalone = item + service;
            const itemAlloc = totalStandalone > 0 ? (item / totalStandalone) * bundle : 0;
            const serviceAlloc = totalStandalone > 0 ? (service / totalStandalone) * bundle : 0;

            document.getElementById('ifrs15_res').innerHTML = `
                <div><strong>${currentLang === 'ar' ? 'إجمالي القيم المنفصلة:' : 'Total Standalone Value:'}</strong> $${totalStandalone.toLocaleString()}</div>
                <div><strong>${currentLang === 'ar' ? 'سعر إيراد المنتج المخصص:' : 'Allocated Item Revenue:'}</strong> $${itemAlloc.toFixed(2).toLocaleString()}</div>
                <div><strong>${currentLang === 'ar' ? 'سعر إيراد الخدمة المخصص (مؤجل):' : 'Allocated Service Revenue:'}</strong> $${serviceAlloc.toFixed(2).toLocaleString()}</div>
            `;
        }

        function calcIFRS16() {
            const pay = parseFloat(document.getElementById('ifrs16_pay').value) || 0;
            const years = parseInt(document.getElementById('ifrs16_years').value) || 1;
            const rate = (parseFloat(document.getElementById('ifrs16_rate').value) || 0) / 100;

            let pv = 0;
            for (let t = 1; t <= years; t++) {
                pv += pay / Math.pow(1 + rate, t);
            }

            const year1Interest = pv * rate;
            const year1Dep = pv / years;

            document.getElementById('ifrs16_res').innerHTML = `
                <div><strong>${currentLang === 'ar' ? 'القيمة الحالية (أصل حق الاستخدام والالتزام):' : 'Present Value (RoU Asset & Lease Liability):'}</strong> $${pv.toFixed(2).toLocaleString()}</div>
                <div><strong>${currentLang === 'ar' ? 'مصروف فائدة السنة الأولى:' : 'Year 1 Interest Expense:'}</strong> $${year1Interest.toFixed(2).toLocaleString()}</div>
                <div><strong>${currentLang === 'ar' ? 'إهلاك أصل حق الاستخدام السنوي:' : 'Annual RoU Asset Depreciation:'}</strong> $${year1Dep.toFixed(2).toLocaleString()}</div>
            `;
        }

        function calcIFRS9() {
            const amount = parseFloat(document.getElementById('ifrs9_amount').value) || 0;
            const pd = (parseFloat(document.getElementById('ifrs9_pd').value) || 0) / 100;
            const lgd = (parseFloat(document.getElementById('ifrs9_lgd').value) || 0) / 100;

            const ecl = amount * pd * lgd;

            document.getElementById('ifrs9_res').innerHTML = `
                <div><strong>${currentLang === 'ar' ? 'إجمالي التعرض الائتماني:' : 'Total Exposure Amount:'}</strong> $${amount.toLocaleString()}</div>
                <div class="text-amber-400 font-bold"><strong>${currentLang === 'ar' ? 'مخصص الخسائر الائتمانية المتوقعة (ECL):' : 'Expected Credit Loss (ECL) Provision:'}</strong> $${ecl.toFixed(2).toLocaleString()}</div>
            `;
        }

        window.onload = function() {
            renderNav();
            renderContent();
        };
    </script>
</body>
</html>
