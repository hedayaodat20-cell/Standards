<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المعايير الدولية — تدرّب على المعايير المحاسبية</title>
<meta name="description" content="تدريب تفاعلي على المعايير المحاسبية: فكرة مختصرة، حالة عملية بأرقام، أسئلة قيود ومبالغ بتصحيح فوري.">
<meta property="og:title" content="المعايير الدولية — تدرّب على المعيار">
<meta property="og:description" content="فكرة بـ 3 سطور، حالة عملية بأرقام، وأسئلة بتصحيح فوري — IAS 2، IAS 16، IAS 38، الإهلاك، الإطار المفاهيمي.">
<meta name="theme-color" content="#f6f4fb">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237350ff' stroke-width='2'%3E%3Cpath d='M3 20V10l6-4v14'/%3E%3Cpath d='M9 20V5l6-2v17'/%3E%3Cpath d='M15 20v-9l6-3v12'/%3E%3Cpath d='M2 20h20'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--purple:#7c4dff;--purple2:#a78bfa;--aqua:#16d7d2;--pink:#f4b7d8;--ink:#111827;--muted:#64748b;--line:rgba(124,77,255,.12);--ok:#0f9d6b;--okbg:#e9faf3;--bad:#d64561;--badbg:#fdeef1;--warn:#b7791f;--warnbg:#fff8e8}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font-family:'Noto Sans Arabic',system-ui,sans-serif;color:var(--ink);line-height:1.75;
 background:radial-gradient(circle at 12% 6%,rgba(255,255,255,.95),transparent 26%),radial-gradient(circle at 85% 12%,rgba(214,230,255,.55),transparent 30%),radial-gradient(circle at 70% 85%,rgba(222,210,255,.40),transparent 30%),linear-gradient(135deg,#f4f6fa 0%,#faf8fc 55%,#f3fbfc 100%);background-attachment:fixed}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.num,.amt{font-variant-numeric:tabular-nums}
.app-shell{width:min(100%,1100px);margin:0 auto;padding:16px 14px 20px}
@media(min-width:760px){.app-shell{width:min(94vw,1100px);margin:3vh auto;padding:26px;border-radius:34px;background:linear-gradient(145deg,rgba(255,255,255,.70),rgba(255,255,255,.40));border:1px solid rgba(255,255,255,.9);box-shadow:0 30px 80px rgba(91,76,114,.14),inset 0 1px 0 #fff;backdrop-filter:blur(26px)}}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:12px}
.brand-icon{width:52px;height:52px;flex:none;border-radius:16px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(168,139,250,.46) 46%,rgba(103,232,249,.42));border:1px solid #fff;box-shadow:0 12px 24px rgba(124,77,255,.18),inset 0 1px 0 #fff}
.brand-icon svg{width:29px;height:29px;color:#7350ff}
.brand-title{margin:0;font-size:23px;line-height:1.2;font-weight:800}
.brand-subtitle{margin:2px 0 0;color:#475569;font-size:13px}
@media(min-width:760px){.brand-icon{width:64px;height:64px;border-radius:20px}.brand-icon svg{width:35px;height:35px}.brand-title{font-size:30px}.brand-subtitle{font-size:14px}}
.glass{background:linear-gradient(145deg,rgba(255,255,255,.80),rgba(255,255,255,.55));border:1px solid rgba(255,255,255,.95);border-radius:22px;box-shadow:0 12px 30px rgba(95,82,110,.08),inset 0 1px 0 #fff}
/* home */
.hero{padding:18px;margin-bottom:14px;background:radial-gradient(circle at 88% 85%,rgba(103,232,249,.28),transparent 40%),radial-gradient(circle at 10% 20%,rgba(167,139,250,.22),transparent 40%),linear-gradient(145deg,rgba(255,255,255,.85),rgba(255,255,255,.55))}
.hero h2{margin:0 0 4px;font-size:21px;font-weight:800}
.hero p{margin:0;color:#475569;font-size:14px}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;padding:0;list-style:none}
.steps li{font-size:12px;padding:4px 10px;border-radius:20px;background:rgba(124,77,255,.08);color:#5b3fd6;font-weight:600}
.overall{margin-top:14px;display:flex;align-items:center;gap:10px;font-size:13px;color:#475569}
.overall .bar{flex:1}
.bar{height:8px;border-radius:8px;background:rgba(124,77,255,.10);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--purple),var(--aqua));transition:width .4s}
.section-label{font-size:14px;font-weight:800;color:#334155;margin:18px 4px 10px}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:960px){.grid{grid-template-columns:1fr 1fr 1fr}}
.topic-card{display:flex;flex-direction:column;gap:8px;padding:16px;text-align:right;border-radius:22px;border:1px solid #fff;box-shadow:0 12px 26px rgba(88,74,102,.08),inset 0 1px 0 #fff;transition:transform .2s,box-shadow .2s;width:100%}
.topic-card:hover{transform:translateY(-3px);box-shadow:0 16px 32px rgba(88,74,102,.12)}
.topic-card.violet{background:radial-gradient(circle at 85% 15%,rgba(198,164,255,.38),transparent 40%),linear-gradient(145deg,rgba(255,255,255,.9),rgba(241,233,255,.6))}
.topic-card.pink{background:radial-gradient(circle at 85% 15%,rgba(255,203,222,.55),transparent 40%),linear-gradient(145deg,rgba(255,255,255,.9),rgba(255,238,245,.6))}
.topic-card.aqua{background:radial-gradient(circle at 85% 15%,rgba(140,236,232,.42),transparent 40%),linear-gradient(145deg,rgba(255,255,255,.9),rgba(232,250,250,.6))}
.tc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.badge{display:inline-block;font-size:12px;font-weight:800;padding:3px 10px;border-radius:12px;background:#fff;color:#5b3fd6;border:1px solid var(--line);direction:ltr}
.chip{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:12px;background:rgba(100,116,139,.10);color:#475569}
.chip.done{background:var(--okbg);color:var(--ok)}
.chip.going{background:rgba(124,77,255,.10);color:#5b3fd6}
.tc-title{font-size:17px;font-weight:800;line-height:1.5}
.tc-en{font-size:12.5px;color:var(--muted);direction:ltr;text-align:right}
.tc-prog{display:flex;align-items:center;gap:8px;font-size:12px;color:#475569}
.tc-prog .bar{flex:1;height:6px}
/* topic */
.back{display:inline-flex;align-items:center;gap:6px;border:1px solid #fff;background:rgba(255,255,255,.75);border-radius:16px;padding:7px 14px;font-size:13.5px;font-weight:700;color:#334155;box-shadow:0 6px 14px rgba(95,82,110,.06)}
.t-head{padding:16px;margin:12px 0}
.t-head h2{margin:8px 0 0;font-size:21px;font-weight:800;line-height:1.5}
.t-head .en{color:var(--muted);font-size:13px;direction:ltr;text-align:right}
.t-head .tc-prog{margin-top:10px}
.card{padding:16px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15.5px;font-weight:800;display:flex;align-items:center;gap:8px}
.card h3 .dot{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:#fff;background:linear-gradient(145deg,#7c4dff,#a78bfa);flex:none}
.idea{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.idea li{position:relative;padding-right:16px;font-size:14.5px}
.idea li::before{content:"";position:absolute;right:0;top:.72em;width:7px;height:7px;border-radius:50%;background:var(--aqua)}
.case-title{font-weight:800;font-size:14.5px;margin-bottom:6px;color:#3b2a8f}
.case p{margin:0 0 4px;font-size:14.5px}
.q{padding:16px;margin-bottom:12px;scroll-margin-top:12px}
.q-n{font-size:12px;font-weight:800;color:#7c4dff;margin-bottom:4px}
.q-text{font-size:15.5px;font-weight:700;margin:0 0 12px;line-height:1.7}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:10px;text-align:right;width:100%;padding:11px 12px;border-radius:14px;border:1.5px solid rgba(124,77,255,.16);background:#fff;font-size:14.5px;line-height:1.65;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--purple2);background:#faf8ff}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;background:rgba(124,77,255,.10);color:#5b3fd6;margin-top:1px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.6}
.num-row{display:flex;gap:8px;align-items:stretch}
.num-row label{position:relative;flex:1;display:flex;min-width:0}
.num-row input{flex:1;min-width:0;height:48px;border-radius:14px;border:1.5px solid rgba(124,77,255,.22);background:#fff;padding:0 14px 0 58px;font-size:17px;font-weight:700;direction:ltr;text-align:left;outline:none}
.num-row input:focus{border-color:var(--purple)}
.num-row .unit{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);font-weight:700;pointer-events:none}
.btn{height:48px;padding:0 16px;border:0;border-radius:14px;font-weight:800;font-size:14px;color:#fff;background:linear-gradient(145deg,#7c4dff,#8f65ff);box-shadow:0 8px 18px rgba(124,77,255,.22);white-space:nowrap}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none}
.btn.ghost{background:#fff;color:#5b3fd6;border:1px solid var(--line);box-shadow:none}
.hint{font-size:12.5px;color:var(--bad);margin-top:6px;min-height:0}
.fb{margin-top:12px;border-radius:16px;padding:12px 14px;font-size:14.5px;animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.fb.ok{background:var(--okbg);border:1px solid rgba(15,157,107,.25)}
.fb.no{background:var(--badbg);border:1px solid rgba(214,69,97,.22)}
.fb-head{font-weight:800;font-size:15px;margin-bottom:4px}
.fb.ok .fb-head{color:var(--ok)}
.fb.no .fb-head{color:var(--bad)}
.fb p{margin:4px 0}
.fb .your{font-weight:700}
.fb .correct-val{font-weight:800}
.entry-title{font-weight:800;font-size:13.5px;margin:12px 0 6px;color:#334155}
.entry{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;font-size:13.5px;border:1px solid rgba(124,77,255,.14)}
.entry th{background:rgba(124,77,255,.07);color:#3b2a8f;font-weight:800;padding:7px 8px;text-align:right;font-size:12.5px}
.entry td{padding:7px 8px;border-top:1px solid rgba(124,77,255,.08);vertical-align:top}
.entry th.n,.entry td.n{text-align:left;direction:ltr;white-space:nowrap;width:1%;font-variant-numeric:tabular-nums}
.entry td.cr-acc{padding-right:26px}
.entry td.sub{color:#475569;font-weight:700}
.entry tr.total td{font-weight:800;background:rgba(22,215,210,.08)}
.mistake{padding:16px;margin-bottom:12px;background:linear-gradient(145deg,#fffaf0,#fff6e3);border:1px solid rgba(183,121,31,.22);border-radius:22px}
.mistake h3{margin:0 0 6px;font-size:15.5px;font-weight:800;color:var(--warn)}
.mistake p{margin:0;font-size:14.5px}
.t-foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin:16px 0 4px}
.score{padding:16px;margin-bottom:12px;text-align:center}
.score b{font-size:22px}
.copyright-footer{margin-top:20px;padding:12px;text-align:center;border-radius:18px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.8);color:var(--muted);font-size:11px;line-height:1.8;direction:ltr}
@media(min-width:760px){.idea li,.case p,.opt,.fb,.mistake p{font-size:15px}.q-text{font-size:16.5px}}
.m{unicode-bidi:isolate;direction:ltr;white-space:nowrap;font-variant-numeric:tabular-nums}
.related .rel{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;margin-top:8px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:700;color:#3b2a8f}
.t-foot .btn{max-width:100%;white-space:normal;line-height:1.4;padding:8px 16px;height:auto;min-height:48px}


/* language toggle + LTR (English) */
.lang-toggle{display:inline-flex;align-items:center;gap:6px;flex:none;height:38px;padding:0 14px;border-radius:19px;border:1px solid rgba(124,77,255,.22);background:rgba(255,255,255,.85);color:#5b3fd6;font-size:13.5px;font-weight:800;box-shadow:0 6px 14px rgba(95,82,110,.08),inset 0 1px 0 #fff;transition:background .15s,border-color .15s}
.lang-toggle:hover{background:#fff;border-color:var(--purple2)}
.lang-toggle .g{font-size:15px;line-height:1}
.topbar{gap:10px}
html[dir="ltr"] body{line-height:1.6}
html[dir="ltr"] .topic-card,html[dir="ltr"] .opt,html[dir="ltr"] .entry th{text-align:left}
html[dir="ltr"] .tc-en,html[dir="ltr"] .t-head .en{text-align:left}
html[dir="ltr"] .idea li{padding-right:0;padding-left:16px}
html[dir="ltr"] .idea li::before{right:auto;left:0}
html[dir="ltr"] .entry th.n,html[dir="ltr"] .entry td.n{text-align:right}
html[dir="ltr"] .entry td.cr-acc{padding-right:8px;padding-left:26px}
html[dir="ltr"] .num-row input{padding:0 58px 0 14px}
html[dir="ltr"] .num-row .unit{left:auto;right:12px}
</style>
</head>

<div class="app-shell">
  <header class="topbar">
    <a class="brand" href="#/">
      <div class="brand-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20V10l6-4v14"/><path d="M9 20V5l6-2v17"/><path d="M15 20v-9l6-3v12"/><path d="M2 20h20"/></svg></div>
      <div><h1 class="brand-title" id="brandTitle">المعايير الدولية</h1><p class="brand-subtitle" id="brandSub">تدرّب على المعايير المحاسبية</p></div>
    </a>

<script>
/* المعايير الدولية — تدرّب على المعيار
   كل موضوع = عنصر واحد بهاي القائمة. إضافة موضوع جديد = نسخ عنصر وتعديل محتواه.
   type: "mc" اختيار من متعدد (correct = رقم الخيار الصحيح يبدأ من 0)
   type: "num" إدخال مبلغ (answer = المبلغ الصحيح، wrong = أخطاء متوقعة مع شرحها)
   entry: القيد الكامل الذي يظهر بعد الإجابة — dr مدين، cr دائن */
window.TOPICS = [
{
  id: "framework",
  code: "CF",
  title: "الإطار المفاهيمي",
  en: "Conceptual Framework",
  color: "violet",
  idea: [
    "الهدف: تقديم معلومات مالية مفيدة للمستثمرين والمقرضين لاتخاذ قراراتهم (Objective of financial reporting).",
    "الخاصيتان الأساسيتان: الملاءمة (Relevance) والتمثيل الصادق (Faithful representation). والمعزِّزة: المقارنة، التحقق، التوقيت المناسب، الفهم.",
    "العناصر الخمسة: الأصل، الالتزام، حقوق الملكية، الدخل، المصروفات (Elements)."
  ],
  caseTitle: "شركة نور للأثاث — عمّان",
  caseText: [
    "شركة نور للأثاث تعدّ قوائمها المالية لسنة 2026. خلال السنة حصل التالي:",
    "• تطبّق الشركة نفس السياسات المحاسبية كل سنة، حتى يقارن المستثمر بين 2025 و2026.",
    "• استلمت 2,000 دينار نقداً من زبون مقدماً عن طاولات ستُسلَّم الشهر القادم.",
    "• المدقق يريد التأكد أن الأرقام تعكس الواقع كما هو: كاملة، محايدة، وخالية من الأخطاء."
  ],
  questions: [
    {
      type: "mc",
      q: "تطبيق نفس السياسات كل سنة حتى يقارن المستثمر بين 2025 و2026 يحقق أي خاصية نوعية؟",
      options: ["الملاءمة (Relevance)", "القابلية للمقارنة (Comparability)", "التوقيت المناسب (Timeliness)", "القابلية للتحقق (Verifiability)"],
      correct: 1,
      why: "القابلية للمقارنة خاصية معزِّزة: تسمح بمقارنة المنشأة مع نفسها عبر السنوات ومع منشآت أخرى. الثبات في تطبيق السياسات (Consistency) وسيلة لتحقيقها.",
      optionWhy: [
        "الملاءمة تعني أن المعلومة تؤثر في القرار (قيمة تنبؤية أو تأكيدية)، وليست عن المقارنة بين السنوات.",
        "",
        "التوقيت المناسب يعني وصول المعلومة قبل أن تفقد قدرتها على التأثير في القرار.",
        "التحقق يعني أن مراقبين مستقلين يصلون لنفس النتيجة تقريباً."
      ]
    },
    {
      type: "mc",
      q: "كيف يُصنَّف مبلغ 2,000 دينار المستلم مقدماً من الزبون عند الاستلام؟",
      options: ["إيراد (Income)", "أصل فقط، بدون أي التزام", "التزام (Liability)", "حقوق ملكية (Equity)"],
      correct: 2,
      why: "الالتزام = واجب حالي على المنشأة بتحويل مورد اقتصادي نتيجة أحداث سابقة. الشركة ملزمة بتسليم الطاولات (أو رد المبلغ)، فالمبلغ التزام عقد إلى أن تُسلَّم الطاولات، وعندها فقط يصبح إيراداً.",
      optionWhy: [
        "لم يُكتسب الإيراد بعد، لأن الطاولات لم تُسلَّم.",
        "النقدية زادت فعلاً (أصل)، لكن يقابلها التزام بالتسليم، والقيد لازم يتوازن.",
        "",
        "حقوق الملكية تأتي من الملاك والأرباح، والزبون ليس مالكاً."
      ],
      entry: [
        { a: "النقدية", dr: 2000 },
        { a: "إيرادات مقبوضة مقدماً (التزام عقد)", cr: 2000 }
      ]
    },
    {
      type: "mc",
      q: "طلب المدقق أن تكون الأرقام كاملة ومحايدة وخالية من الأخطاء. أي خاصية هذه، وما نوعها؟",
      options: ["القابلية للتحقق — خاصية معزِّزة", "الموثوقية (Reliability) — خاصية أساسية", "التمثيل الصادق — خاصية أساسية", "القابلية للفهم — خاصية معزِّزة"],
      correct: 2,
      why: "التمثيل الصادق (Faithful representation) خاصية أساسية، وعناصره الثلاثة: الاكتمال (Complete)، الحياد (Neutral)، الخلو من الأخطاء (Free from error).",
      optionWhy: [
        "التحقق معزِّزة وتعني اتفاق مراقبين مستقلين، أما الاكتمال والحياد والخلو من الأخطاء فهي عناصر التمثيل الصادق.",
        "مصطلح «الموثوقية» قديم؛ استُبدل بـ «التمثيل الصادق» منذ إطار 2010.",
        "",
        "القابلية للفهم تعني عرض المعلومة بوضوح، وليست عن الاكتمال والحياد."
      ]

    ],

    "optionWhy": [

<script>

var KEY = "almadina-standards-practice-v1";
var LANG_KEY = "almadina-standards-lang";
var app = document.getElementById("app");
var lang = "ar";
try { if (localStorage.getItem(LANG_KEY) === "en") lang = "en"; } catch(e){}

/* نصوص الواجهة باللغتين */
var UI = {
  ar: {

    steps: ["الفكرة بـ 3 سطور", "حالة عملية", "أسئلة بتصحيح فوري", "الغلطة الشائعة بالامتحان"],
    overall: "التقدم الكلي", topics: "المواضيع",

    mistake: "⚠️ الغلطة الشائعة بالامتحان", related: "مواضيع مرتبطة", relArrow: "←",
    reset: "إعادة تدريب هذا الموضوع", next: "الموضوع التالي: ", nextArrow: " ←", home: "العودة لقائمة المواضيع",
    score: "النتيجة", allRight: "ممتاز، كل الإجابات صحيحة.", retry: "إعادة التدريب متاحة لتثبيت الفكرة.",

    tableTitle: "التحليل (بالدينار)",

  },
  en: {
    title: "International Standards", sub: "Practise the accounting standards",
    docHome: "International Standards — Practise IFRS & IAS", docSuffix: " — International Standards",
    toggle: "عربي", toggleAria: "التبديل إلى العربية", toggleTitle: "Language",
    heroH: "Practise the standard",
    heroP: "Hands-on practice instead of memorising: each topic gives you the key idea in brief, a case with real numbers, and journal-entry and amount questions with instant feedback.",
    steps: ["The idea in 3 lines", "A practical case", "Questions with instant feedback", "The common exam mistake"],
    overall: "Overall progress", topics: "Topics",
    notStarted: "Not started", going: "In progress", done: "Completed ✓",
    qs: " questions", correctN: " correct",
    back: "← All topics", idea: "Key idea", caseH: "Practical case", questions: "Questions",

    reset: "Retake this topic", next: "Next topic: ", nextArrow: " →", home: "Back to all topics",
    score: "Score", allRight: "Excellent — every answer is correct.", retry: "You can retake the topic to lock in the idea.",
    qOf: function(i, n){ return "Question " + i + " of " + n; },
    amount: "Amount", amountAria: "Amount in JD", check: "Check",
    hint: "Enter the amount in figures only, e.g. 7200 or 7,200",
    ok: "✓ Correct", no: "✗ Incorrect", whyWrong: "Why it's wrong: ", correctAns: "Correct answer: ",
    whereFrom: function(v){ return "Where does " + v + " come from? "; },
    money: function(v){ return "JD\u00a0" + v; },
    reason: "Explanation: ", entryTitle: "The full correct journal entry", colAcc: "Account", colDr: "Debit", colCr: "Credit",
    tableTitle: "Analysis (JD)",
    letters: ["A","B","C","D","E","F"]
  }
};
function U(){ return UI[lang]; }

/* يبني نسخة إنجليزية من كل موضوع: النصوص من TOPICS_EN، والأرقام والإجابات من البيانات العربية نفسها */
function localize(t){
  var e = TOPICS_EN[t.id];
  if (lang !== "en" || !e) return t;
  var c = {};
  for (var k in t) c[k] = t[k];
  ["code","title","caseTitle","mistake"].forEach(function(k){ if (e[k]) c[k] = e[k]; });
  c.en = e.sub || "";
  if (e.idea) c.idea = e.idea;
  if (e.caseText) c.caseText = e.caseText;
  if (t.related && e.related) c.related = t.related.map(function(r, i){ return {id: r.id, text: e.related[i] || r.text}; });
  c.questions = t.questions.map(function(q, i){
    var eq = (e.questions || [])[i] || {}, n = {};
    for (var k in q) n[k] = q[k];
    if (eq.q) n.q = eq.q;
    if (eq.why) n.why = eq.why;
    if (eq.options) n.options = eq.options;
    if (eq.optionWhy) n.optionWhy = eq.optionWhy;
    if (eq.wrong) n.wrong = eq.wrong;
    if (q.entry && eq.entry) n.entry = q.entry.map(function(x, j){ var y = {}; for (var k in x) y[k] = x[k]; if (eq.entry[j]) y.a = eq.entry[j]; return y; });
    if (q.table && eq.table) n.table = q.table.map(function(r, j){ return [eq.table[j] || r[0], r[1]]; });
    return n;
  });
  return c;
}
var TOPICS = [];
function applyLang(){
  TOPICS = TOPICS_AR.map(localize);
  var u = U(), root = document.documentElement;
  root.setAttribute("lang", lang);
  root.setAttribute("dir", lang === "en" ? "ltr" : "rtl");
  document.getElementById("brandTitle").textContent = u.title;
  document.getElementById("brandSub").textContent = u.sub;
  document.getElementById("langLabel").textContent = u.toggle;
  var tb = document.getElementById("langToggle");
  tb.setAttribute("aria-label", u.toggleAria);
  tb.setAttribute("title", u.toggleTitle);
  document.getElementById("langLabel").setAttribute("lang", lang === "en" ? "ar" : "en");
}

function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; } }
function save(s){ try { localStorage.setItem(KEY, JSON.stringify(s)); } catch(e){} }
var state = load();

function fmt(n){
  var neg = n < 0, a = Math.abs(n);
  var s = a.toLocaleString("en-US", {maximumFractionDigits: 2});
  return neg ? "(" + s + ")" : s;
}
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
/* أي تعبير حسابي (أرقام وعمليات) يُعرض من اليسار لليمين داخل النص العربي */
var MATH = /[\d(][\d,.\s×÷+\-−=%\/()]*[\d)%]/g;
function rich(s){
  return esc(s).replace(MATH, function(m){
    var pre = "", post = "";
    var cnt = function(x, c){ return x.split(c).length - 1; };
    while (m.charAt(m.length - 1) === ")" && cnt(m, ")") > cnt(m, "(")) { post = ")" + post; m = m.slice(0, -1); }
    while (m.charAt(0) === "(" && cnt(m, "(") > cnt(m, ")")) { pre += "("; m = m.slice(1); }
    m = m.replace(/\s+$/, function(sp){ post = sp + post; return ""; });
    if (!/[×÷+\-−=%\/,()]/.test(m.replace(/^\d+$/, ""))) return pre + m + post;
    return pre + '<bdi dir="ltr" class="m">' + m + '</bdi>' + post;
  });
}
function parseAmount(raw){
  var s = String(raw).trim()
    .replace(/[\u0660-\u0669]/g, function(d){ return d.charCodeAt(0) - 0x0660; })
    .replace(/[\u06F0-\u06F9]/g, function(d){ return d.charCodeAt(0) - 0x06F0; })
    .replace(/[٬,\s]/g, "").replace(/٫/g, ".").replace(/[−–]/g, "-")
    .replace(/دينار|JOD|JD/gi, "");
  if (!/^-?\d+(\.\d+)?$/.test(s)) return null;
  return parseFloat(s);
}
function topicStats(t){
  var rec = state[t.id] || {}, answered = 0, right = 0;
  t.questions.forEach(function(q, i){ if (rec[i]) { answered++; if (rec[i].ok) right++; } });
  return {answered: answered, right: right, total: t.questions.length};
}
function statusChip(st){
  if (st.answered === 0) return '<span class="chip">' + U().notStarted + '</span>';
  if (st.answered < st.total) return '<span class="chip going">' + U().going + '</span>';
  return '<span class="chip done">' + U().done + '</span>';
}
function progRow(st){
  var pct = st.total ? Math.round(st.answered / st.total * 100) : 0;
  return '<div class="tc-prog"><div class="bar"><i style="width:' + pct + '%"></i></div><span class="num">' +
    st.answered + '/' + st.total + U().qs + (st.answered ? ' · ' + st.right + U().correctN : '') + '</span></div>';
}

/* ---------- Home ---------- */
function renderHome(){
  var tot = 0, ans = 0, right = 0;
  TOPICS.forEach(function(t){ var s = topicStats(t); tot += s.total; ans += s.answered; right += s.right; });
  var pct = tot ? Math.round(ans / tot * 100) : 0;
  var u = U();
  var h = '<section class="glass hero">' +
    '<h2>' + u.heroH + '</h2>' +
    '<p>' + u.heroP + '</p>' +
    '<ul class="steps">' + u.steps.map(function(s){ return '<li>' + s + '</li>'; }).join("") + '</ul>' +
    '<div class="overall"><span>' + u.overall + '</span><div class="bar"><i style="width:' + pct + '%"></i></div><span class="num">' + ans + '/' + tot + '</span></div>' +
    '</section>' +
    '<div class="section-label">' + u.topics + '</div><div class="grid">';
  TOPICS.forEach(function(t){
    var st = topicStats(t);
    h += '<a class="topic-card ' + (t.color || "violet") + '" href="#/t/' + t.id + '">' +
      '<div class="tc-top"><span class="badge">' + esc(t.code) + '</span>' + statusChip(st) + '</div>' +
      '<div class="tc-title">' + esc(t.title) + '</div>' +
      '<div class="tc-en">' + esc(t.en) + '</div>' + progRow(st) + '</a>';
  });
  h += '</div>';
  app.innerHTML = h;
  document.title = u.docHome;
}

/* ---------- Entry / table ---------- */
function entryHTML(entry){
  var drs = entry.filter(function(e){ return e.dr; }), crs = entry.filter(function(e){ return e.cr; });
  var rows = "", u = U(), en = lang === "en";
  if (drs.length > 1 && !en) rows += '<tr><td class="sub">من مذكورين</td><td class="n"></td><td class="n"></td></tr>';
  drs.forEach(function(e){
    rows += '<tr><td>' + (en ? '' : (drs.length > 1 ? 'حـ/ ' : 'من حـ/ ')) + esc(e.a) + '</td><td class="n">' + fmt(e.dr) + '</td><td class="n"></td></tr>';
  });
  if (crs.length > 1 && !en) rows += '<tr><td class="sub cr-acc">إلى مذكورين</td><td class="n"></td><td class="n"></td></tr>';
  crs.forEach(function(e){
    rows += '<tr><td class="cr-acc">' + (en ? '' : (crs.length > 1 ? 'حـ/ ' : 'إلى حـ/ ')) + esc(e.a) + '</td><td class="n"></td><td class="n">' + fmt(e.cr) + '</td></tr>';
  });
  return '<div class="entry-title">' + u.entryTitle + '</div><table class="entry"><thead><tr><th>' + u.colAcc + '</th><th class="n">' + u.colDr + '</th><th class="n">' + u.colCr + '</th></tr></thead><tbody>' + rows + '</tbody></table>';
}
function tableHTML(rows){
  var h = '<div class="entry-title">' + U().tableTitle + '</div><table class="entry"><tbody>';
  rows.forEach(function(r, i){
    h += '<tr' + (i === rows.length - 1 ? ' class="total"' : '') + '><td>' + esc(r[0]) + '</td><td class="n">' + fmt(r[1]) + '</td></tr>';
  });
  return h + '</tbody></table>';
}

/* ---------- Topic ---------- */
function renderTopic(id){
  var idx = -1;
  TOPICS.forEach(function(t, i){ if (t.id === id) idx = i; });
  if (idx < 0) { location.hash = "#/"; return; }
  var t = TOPICS[idx], st = topicStats(t), u = U();
  var h = '<a class="back" href="#/">' + u.back + '</a>' +
    '<section class="glass t-head"><span class="badge">' + esc(t.code) + '</span>' +
    '<h2>' + esc(t.title) + '</h2><div class="en">' + esc(t.en) + '</div><div id="tprog">' + progRow(st) + '</div></section>' +
    '<section class="glass card"><h3><span class="dot">1</span>' + u.idea + '</h3><ul class="idea">' +
    t.idea.map(function(l){ return '<li>' + rich(l) + '</li>'; }).join("") + '</ul></section>' +
    '<section class="glass card case"><h3><span class="dot">2</span>' + u.caseH + '</h3><div class="case-title">' + rich(t.caseTitle) + '</div>' +
    t.caseText.map(function(p){ return '<p>' + rich(p) + '</p>'; }).join("") + '</section>' +
    '<div class="section-label">' + u.questions + '</div>';
  t.questions.forEach(function(q, i){ h += '<section class="glass q" id="q' + i + '"></section>'; });
  h += '<section class="mistake"><h3>' + u.mistake + '</h3><p>' + rich(t.mistake) + '</p></section>' +
    (t.related && t.related.length ? '<section class="glass card related"><h3>' + u.related + '</h3>' + t.related.map(function(r){ return '<a class="rel" href="#/t/' + r.id + '">' + rich(r.text) + ' <span aria-hidden="true">' + u.relArrow + '</span></a>'; }).join("") + '</section>' : '') +
    '<div id="score"></div>' +
    '<div class="t-foot"><button class="btn ghost" id="reset">' + u.reset + '</button>' +
    (TOPICS[idx + 1] ? '<a class="btn" style="display:inline-flex;align-items:center" href="#/t/' + TOPICS[idx + 1].id + '">' + u.next + esc(TOPICS[idx + 1].title.split(" — ")[0]) + u.nextArrow + '</a>'
                     : '<a class="btn" style="display:inline-flex;align-items:center" href="#/">' + u.home + '</a>') + '</div>';
  app.innerHTML = h;
  document.title = t.title + u.docSuffix;
  t.questions.forEach(function(q, i){ renderQuestion(t, q, i); });
  updateScore(t);
  document.getElementById("reset").onclick = function(){
    delete state[t.id]; save(state); renderTopic(t.id); window.scrollTo(0, 0);
  };
}

function updateScore(t){
  var st = topicStats(t);
  document.getElementById("tprog").innerHTML = progRow(st);
  var el = document.getElementById("score");
  if (st.answered === st.total) {
    el.innerHTML = '<section class="glass score"><div>' + U().score + '</div><b class="num">' + st.right + ' / ' + st.total + '</b><div style="font-size:13px;color:#64748b">' +
      (st.right === st.total ? U().allRight : U().retry) + '</div></section>';
  } else el.innerHTML = "";
}

function renderQuestion(t, q, i){
  var box = document.getElementById("q" + i);
  var rec = (state[t.id] || {})[i];
  var u = U(), LETTERS = u.letters;
  var h = '<div class="q-n">' + u.qOf(i + 1, t.questions.length) + '</div><p class="q-text">' + rich(q.q) + '</p>';
  if (q.type === "mc") {
    h += '<div class="opts">';
    q.options.forEach(function(o, j){
      var cls = "";
      if (rec) { if (j === q.correct) cls = " right"; else if (j === rec.v) cls = " wrong"; else cls = " dim"; }
      h += '<button class="opt' + cls + '" data-j="' + j + '"' + (rec ? " disabled" : "") + '><span class="k">' + LETTERS[j] + '</span><span>' + rich(o) + '</span></button>';
    });
    h += '</div>';
  } else {
    h += '<div class="num-row"><label><input type="text" inputmode="decimal" autocomplete="off" placeholder="' + u.amount + '" aria-label="' + u.amountAria + '"' +
      (rec ? ' value="' + esc(fmt(rec.v)) + '" disabled' : '') + '><span class="unit">JOD</span></label>' +
      '<button class="btn check"' + (rec ? " disabled" : "") + '>' + u.check + '</button></div><div class="hint"></div>';
  }
  if (rec) h += feedbackHTML(q, rec);
  box.innerHTML = h;
  if (rec) return;
  if (q.type === "mc") {
    box.querySelectorAll(".opt").forEach(function(b){
      b.onclick = function(){ answer(t, q, i, +b.getAttribute("data-j")); };
    });
  } else {
    var inp = box.querySelector("input"), btn = box.querySelector(".check"), hint = box.querySelector(".hint");
    var go = function(){
      var v = parseAmount(inp.value);
      if (v === null) { hint.textContent = u.hint; inp.focus(); return; }
      answer(t, q, i, v);
    };
    btn.onclick = go;
    inp.onkeydown = function(e){ if (e.key === "Enter") go(); };
  }
}

function answer(t, q, i, v){
  var ok = q.type === "mc" ? v === q.correct : Math.abs(v - q.answer) < 0.5;
  state[t.id] = state[t.id] || {};
  state[t.id][i] = {v: v, ok: ok};
  save(state);
  renderQuestion(t, q, i);
  updateScore(t);
  var fb = document.querySelector("#q" + i + " .fb");
  if (fb && fb.getBoundingClientRect().bottom > window.innerHeight) fb.scrollIntoView({behavior: "smooth", block: "nearest"});
}

function feedbackHTML(q, rec){
  var u = U(), LETTERS = u.letters;
  var h = '<div class="fb ' + (rec.ok ? "ok" : "no") + '">';
  if (rec.ok) {
    h += '<div class="fb-head">' + u.ok + '</div>';
  } else {
    h += '<div class="fb-head">' + u.no + '</div>';
    if (q.type === "mc") {
      if (q.optionWhy && q.optionWhy[rec.v]) h += '<p><span class="your">' + u.whyWrong + '</span>' + rich(q.optionWhy[rec.v]) + '</p>';
      h += '<p>' + u.correctAns + '<span class="correct-val">' + LETTERS[q.correct] + ') ' + rich(q.options[q.correct]) + '</span></p>';
    } else {
      var key = Object.keys(q.wrong || {}).filter(function(k){ return Math.abs(+k - rec.v) < 0.5; })[0];
      if (key) h += '<p><span class="your">' + u.whereFrom(fmt(rec.v)) + '</span>' + rich(q.wrong[key]) + '</p>';
      h += '<p>' + u.correctAns + '<span class="correct-val num">' + u.money(fmt(q.answer)) + '</span></p>';
    }
  }
  h += '<p><span class="your">' + u.reason + '</span>' + rich(q.why) + '</p>';
  if (q.entry) h += entryHTML(q.entry);
  if (q.table) h += tableHTML(q.table);
  return h + '</div>';
}

/* ---------- Router ---------- */
function route(){
  var m = location.hash.match(/^#\/t\/([\w-]+)/);
  if (m) renderTopic(m[1]); else renderHome();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
document.getElementById("langToggle").onclick = function(){
  lang = lang === "en" ? "ar" : "en";
  try { localStorage.setItem(LANG_KEY, lang); } catch(e){}
  applyLang();
  var y = window.scrollY;
  var m = location.hash.match(/^#\/t\/([\w-]+)/);
  if (m) renderTopic(m[1]); else renderHome();
  window.scrollTo(0, y);
};
applyLang();
route();
})();

</script>
